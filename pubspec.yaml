name: mars_explorer_app
description: "A new Flutter project."
publish_to: 'none' # Prevents accidental publishing to pub.dev

# App version: major.minor.patch+build_number
version: 1.0.0+1

# Dart SDK version constraint
environment:
  sdk: ^3.10.0-290.4.beta

# Runtime dependencies (packages your app needs to run)
dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.8.3 # To play Videos
  http: ^1.2.0 # This is for API calls
  flutter_map: ^6.1.0      # 2D tile map
  latlong2: ^0.9.1        # Required by flutter_map for coordinates
  webview_flutter: ^4.4.0   # 3D globe via Three.js
  path_provider: ^2.1.5  # Access device directories for file storage (temp files, app documents, cache)

  # iOS-style icons
  cupertino_icons: ^1.0.8
  
  # Opens URLs in browser/email/phone apps
  url_launcher: ^6.2.5
  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3

# Development dependencies (only used during development/testing)
dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4        # For mocking HTTP calls
  build_runner: ^2.4.9   # Required by mockito
  
  # Linting rules for code quality
  flutter_lints: ^6.0.0
  
  # Generates app icons for Android/iOS
  flutter_launcher_icons: ^0.13.1

# Configuration for flutter_launcher_icons package
flutter_launcher_icons:
  android: true  # Generate Android icons
  ios: true      # Generate iOS icons
  image_path: "assets/icons/icon.png"  # Source image (must be at least 1024x1024)

# Flutter-specific configuration
flutter:
  uses-material-design: true  # Includes Material Design icons
  
  # Uncomment to add image/file assets to your app
  assets:
    - assets/icons/icon.png        # Your app icon source
    - assets/images/mars-gallery-icon1.png
    - assets/images/mars-gallery-icon2.png
    - assets/images/universe-background.jpg
  #   - assets/images/         # Include all images in this folder

  # Uncomment to add custom fonts
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: fonts/Roboto-Regular.ttf
  #       - asset: fonts/Roboto-Bold.ttf
  #         weight: 700